name: simple_feedback
description: >-
  An in-app feedback dialog for Flutter backed by Firebase (Firestore +
  Firebase Storage). Feedback type selection, screenshot attachments with
  automatic page capture, anonymous device id, and built-in zh/en/ja strings.
version: 0.1.0
topics:
  - feedback
  - widget
  - form

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.10.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.3.0
  flutter_lints: ^6.0.0
