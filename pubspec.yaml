name: simple_feedback
description: >-
  An in-app feedback dialog for Flutter backed by Firebase. Feedback type
  selection, screenshot attachments (embedded into Firestore documents by
  default, or uploaded to Firebase Storage), automatic page capture,
  anonymous device id, and built-in zh/en/ja strings.
version: 1.0.1
repository: https://github.com/zhixiakj/simple_feedback
issue_tracker: https://github.com/zhixiakj/simple_feedback/issues
topics:
  - feedback
  - widget
  - form

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.10.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.3.0
  flutter_lints: ^6.0.0
