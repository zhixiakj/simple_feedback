<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Firestore Blob → 图片</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #333; }
  textarea { width: 100%; height: 140px; font-family: monospace; font-size: 12px; }
  button { padding: 8px 20px; font-size: 14px; cursor: pointer; }
  img { max-width: 100%; border: 1px solid #ddd; margin-top: 12px; }
  .hint { color: #888; font-size: 13px; }
  #meta { margin-top: 8px; font-size: 13px; color: #555; }
</style>
</head>
<body>
  <h3>Firestore Blob → 图片</h3>
  <p class="hint">
    simple_feedback 默认把截图以 Blob 存进 Firestore 文档的 <code>imgs</code> 字段，
    控制台里显示为 base64 文本。在 Firestore 控制台点开该字段值 → 复制 → 粘贴到下面 → 显示。
  </p>
  <textarea id="input" placeholder="粘贴 base64（可含 blob:/data:image 前缀、引号或换行，会自动清理）"></textarea>
  <div style="margin-top:8px">
    <button onclick="render()">显示图片</button>
    <button onclick="download()" id="dl" disabled>下载</button>
    <button onclick="document.getElementById('input').value='';render()">清空</button>
  </div>
  <div id="meta"></div>
  <img id="out" style="display:none">
<script>
  function clean() {
    var s = document.getElementById('input').value
      .replace(/^.*?base64,/i, '')   // data:image/jpeg;base64, 前缀
      .replace(/^blob:/i, '')
      .replace(/[\s"'`]/g, '');      // 引号/换行
    return s;
  }
  function sniffMime(b64) {
    if (b64.startsWith('iVBORw0KG')) return 'image/png';
    if (b64.startsWith('/9j/')) return 'image/jpeg';
    if (b64.startsWith('R0lGOD')) return 'image/gif';
    if (b64.startsWith('UklGR')) return 'image/webp';
    return 'image/jpeg';
  }
  function render() {
    var b64 = clean();
    var out = document.getElementById('out');
    var meta = document.getElementById('meta');
    var dl = document.getElementById('dl');
    out.style.display = 'none'; dl.disabled = true; meta.textContent = '';
    if (b64.length < 32) { meta.textContent = b64 ? '内容太短，不像图片数据' : ''; return; }
    var mime = sniffMime(b64);
    out.onerror = function () { meta.textContent = '无法解码（MIME 猜测为 ' + mime + '，可截图反馈给开发者）'; out.style.display='none'; };
    out.onload = function () {
      out.style.display = '';
      dl.disabled = false;
      var bytes = Math.floor(b64.length * 3 / 4);
      meta.textContent = '格式 ' + mime + '，约 ' + (bytes / 1024).toFixed(0) + ' KB';
    };
    out.src = 'data:' + mime + ';base64,' + b64;
  }
  function download() {
    var a = document.createElement('a');
    a.href = document.getElementById('out').src;
    a.download = 'feedback_image.' + document.getElementById('out').src.split(';')[0].split(':')[1].split('/')[1];
    a.click();
  }
  // 点击输入框以外任意区域（含按钮）时失焦，收起手机软键盘
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('input, textarea') && document.activeElement) {
      document.activeElement.blur();
    }
  });
</script>
</body>
</html>
